# Builds DeskBar, DeskDrawer and DeskTune on Windows and runs each app's --selftest on every push.
# Each self-test writes PASS/FAIL lines to a report; the reports are attached to the run.
name: Build and self-test

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in Desk-Setup.exe (and the draft release's name)"
        default: "4.0"
      draft_release:
        description: "Make a draft GitHub release with the files"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Launch contract (names and paths the apps share)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: python3 .github/launch-contract.py

  deskbar:
    name: DeskBar (C++)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./src/DeskBar/build.ps1 -Out "$env:RUNNER_TEMP\deskbar"
      - name: Self-test
        shell: pwsh
        run: ./.github/selftest.ps1 -Exe "$env:RUNNER_TEMP\deskbar\DeskBar_blue_BUILD.exe" -Report "$env:RUNNER_TEMP\reports\DeskBar.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-DeskBar
          path: ${{ runner.temp }}/reports/
          if-no-files-found: ignore

  wpf:
    name: ${{ matrix.app }} (C#)
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [DeskDrawer, DeskTune]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        run: dotnet build "src/${{ matrix.app }}/${{ matrix.app }}.csproj" -c Release -o "$env:RUNNER_TEMP\app"
      - name: Self-test
        shell: pwsh
        run: ./.github/selftest.ps1 -Exe "$env:RUNNER_TEMP\app\${{ matrix.app }}.exe" -Report "$env:RUNNER_TEMP\reports\${{ matrix.app }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.app }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: ignore

  # The release files: the three app setups, Desk-Setup.exe (all three in one installer) and SHA256SUMS.txt with build times.
  # Then a test install of Desk-Setup.exe on the runner. Run by hand with "make draft release" ticked to put them on a draft GitHub release
  # (a draft is only visible to you; publishing it is still your click).
  package:
    name: Release files and Desk-Setup.exe
    needs: [contract, deskbar, wpf]
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the release files
        shell: pwsh
        run: ./installer/make-release.ps1 -Version "${{ inputs.version || '4.0' }}" -Out "$env:RUNNER_TEMP\release"
      - name: Test install of Desk-Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\release-log" | Out-Null
          $p = Start-Process "$env:RUNNER_TEMP\release\Desk-Setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\release-log\install.log" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill($true); Write-Host "::error::Desk-Setup.exe did not finish in 5 minutes"; exit 1 }
          Write-Host "Desk-Setup.exe exit code $($p.ExitCode)"
          $bad = 0
          foreach ($exe in 'DeskBar3\bin\DeskBar.exe', 'DeskDrawer\DeskDrawer.exe', 'DeskTune\DeskTune.exe') {
            $f = Join-Path $env:LOCALAPPDATA "Programs\$exe"
            if (Test-Path $f) { Write-Host "installed: $f" } else { Write-Host "::error::not installed: $f"; $bad++ }
          }
          if ($p.ExitCode -ne 0 -or $bad) { exit 1 }
      - name: Launch paths (menus, Settings buttons, shortcuts, hotkeys, updates while open)
        shell: powershell
        run: ./.github/launch-test.ps1 -Report "$env:RUNNER_TEMP\release-log\launch-test.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Desk-release
          path: |
            ${{ runner.temp }}/release/*.exe
            ${{ runner.temp }}/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-log
          path: ${{ runner.temp }}/release-log/
          if-no-files-found: ignore
      - name: Draft release
        if: github.event_name == 'workflow_dispatch' && inputs.draft_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $r = "$env:RUNNER_TEMP\release"
          gh release create "v${{ inputs.version }}" --draft --target "${{ github.sha }}" --title "Desk ${{ inputs.version }}" --notes-file release/NOTES.md `
            "$r\DeskBar-Setup.exe" "$r\DeskDrawer-Setup.exe" "$r\DeskTune-Setup.exe" "$r\Desk-Setup.exe" "$r\SHA256SUMS.txt"
